<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดทำเอกสารบัญชี</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="login-section" class="container glass-panel">
        <div class="login-box">
            <h2>เข้าสู่ระบบ</h2>
            <p>ระบบจัดการเอกสารบัญชีและการเงิน</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" required placeholder="name@company.com">
                </div>
                <div class="input-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" id="login-btn" class="btn-primary">เข้าสู่ระบบ</button>
            </form>
            <p id="login-error" class="error-text" style="display: none;"></p>
        </div>
    </div>

    <div id="app-section" class="app-layout" style="display: none;">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>UM Accounting</h3>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard">หน้าหลัก (Dashboard)</a>
                <a href="#" class="nav-item" data-page="create-pv">สร้างใบสำคัญจ่าย (PV)</a>
                <a href="#" class="nav-item" data-page="create-receipt">สร้างหนังสือรับรองฯ</a>
                <button id="logout-btn" class="btn-outline" style="margin-top: 2rem; width: 100%;">ออกจากระบบ</button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button id="menu-toggle" class="mobile-only">☰ เมนู</button>
                <div class="user-info">
                    <span id="user-email">user@email.com</span>
                </div>
            </header>
            
            <div id="page-content" class="content-area">
                
                <div id="view-dashboard" class="page-view">
                    <h2>ภาพรวมระบบ (Dashboard)</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h3>เอกสารรออนุมัติ</h3>
                            <p class="stat-number" id="stat-pending">0</p>
                        </div>
                        <div class="stat-card">
                            <h3>จ่ายแล้ว (เดือนนี้)</h3>
                            <p class="stat-number" id="stat-paid">฿0.00</p>
                        </div>
                    </div>
                </div>

                <div id="view-create-pv" class="page-view" style="display: none;">
                    <h2>สร้างใบสำคัญจ่าย (Payment Voucher)</h2>
                    <div class="glass-panel form-container">
                        <form id="pv-form">
                            <div class="form-row">
                                <div class="input-group">
                                    <label>วันที่เอกสาร</label>
                                    <input type="date" id="doc_date" required>
                                </div>
                                <div class="input-group">
                                    <label>ชื่อผู้รับเงิน / Vendor</label>
                                    <input type="text" id="vendor_name" placeholder="บริษัท / นาย..." required>
                                </div>
                            </div>
                            
                            <div class="input-group">
                                <label>รายละเอียดการจ่าย</label>
                                <input type="text" id="remarks" placeholder="ค่าสินค้า, ค่าบริการ..." required>
                            </div>

                            <div class="form-row">
                                <div class="input-group">
                                    <label>ยอดก่อนภาษี (บาท)</label>
                                    <input type="number" id="base_amount" step="0.01" required>
                                </div>
                                <div class="input-group">
                                    <label>หัก ณ ที่จ่าย (%)</label>
                                    <select id="wht_rate">
                                        <option value="0">ไม่มีหัก ณ ที่จ่าย</option>
                                        <option value="1">1% (ค่าขนส่ง)</option>
                                        <option value="3">3% (ค่าบริการ)</option>
                                        <option value="5">5% (ค่าเช่า)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="summary-box">
                                <p>ยอดสุทธิที่ต้องจ่าย: <strong id="net_amount_display" style="font-size: 1.5rem; color: #10b981;">฿0.00</strong></p>
                            </div>

                            <button type="submit" class="btn-primary" style="margin-top: 1rem;">บันทึกเอกสาร</button>
                        </form>
                    </div>
                </div>

            </div>

    <script type="module" src="supabaseClient.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
