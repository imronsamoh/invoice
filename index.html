<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดทำเอกสารบัญชี</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="login-section" class="container glass-panel">
        <div class="login-box">
            <h2>เข้าสู่ระบบ</h2>
            <p>ระบบจัดการเอกสารบัญชีและการเงิน</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" required placeholder="name@company.com">
                </div>
                <div class="input-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" id="login-btn" class="btn-primary">เข้าสู่ระบบ</button>
            </form>
            <p id="login-error" class="error-text" style="display: none;"></p>
        </div>
    </div>

    <div id="app-section" class="app-layout" style="display: none;">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>UM Accounting</h3>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard">หน้าหลัก (Dashboard)</a>
                <a href="#" class="nav-item" data-page="create-pv">สร้างใบสำคัญจ่าย (PV)</a>
                <a href="#" class="nav-item" data-page="create-receipt">สร้างหนังสือรับรองฯ</a>
                <button id="logout-btn" class="btn-outline" style="margin-top: 2rem; width: 100%;">ออกจากระบบ</button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button id="menu-toggle" class="mobile-only">☰ เมนู</button>
                <div class="user-info">
                    <span id="user-email">user@email.com</span>
                </div>
            </header>
            
            <div id="page-content" class="content-area">
                <h2>ยินดีต้อนรับสู่ระบบ</h2>
                <p>เลือกเมนูด้านซ้ายเพื่อเริ่มต้นทำงาน</p>
            </div>
        </main>
    </div>

    <script type="module" src="supabaseClient.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
